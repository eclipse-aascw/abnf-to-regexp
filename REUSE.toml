version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on PyPI) or which can not carry a comment.
[[annotations]]
path = ["AUTHORS", "CHANGELOG.rst", "README.rst", "abnf_to_regexp/py.typed"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 abnf-to-regexp AUTHORS"
SPDX-License-Identifier = "MIT"

# The recorded test outputs and the (counter-)examples are compared or matched
# byte-by-byte by the tests, so they must not carry a header. The grammar with
# cycles is a test input written for this project.
[[annotations]]
path = [
    "test_data/**/expected.err",
    "test_data/**/expected.out",
    "test_data/**/expected.py",
    "test_data/**/example_*.txt",
    "test_data/**/counter_example_*.txt",
    "test_data/nested-python/grammar_with_cycles/grammar.abnf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 abnf-to-regexp AUTHORS"
SPDX-License-Identifier = "MIT"

# These test grammars are copied from IETF RFCs (and BCP 47). The code
# components of RFCs, such as ABNF, are licensed by the IETF Trust under the
# Revised BSD License. We keep them as copied and do not add a header.
[[annotations]]
path = [
    "test_data/nested-python/bcp47/grammar.abnf",
    "test_data/nested-python/internet_media_type/grammar.abnf",
    "test_data/nested-python/rfc2396/grammar.abnf",
    "test_data/nested-python/rfc2732/grammar.abnf",
    "test_data/nested-python/rfc3339/grammar.abnf",
    "test_data/nested-python/rfc3986/grammar.abnf",
    "test_data/nested-python/rfc3987/grammar.abnf",
    "test_data/nested-python/rfc8089/grammar.abnf",
    "test_data/single-regexp/rfc3987/grammar.abnf",
    "test_data/single-regexp/rfc8141/grammar.abnf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "IETF Trust and the persons identified as the document authors"
SPDX-License-Identifier = "BSD-3-Clause"
